allow_embedding: false
db_schema:
  inventory_cells:
    client: none
    columns:
    - {name: row_key, type: string}
    - {name: column_key, type: string}
    - {name: quantity, type: number}
    - {name: entered_by, type: string}
    - {name: entered_at, type: datetime}
    server: full
    title: Latest inventory cells
  inventory_columns:
    client: none
    columns:
    - {name: column_key, type: string}
    - {name: label, type: string}
    - {name: sort_order, type: number}
    - {name: active, type: bool}
    server: full
    title: Inventory columns
  inventory_history:
    client: none
    columns:
    - {name: entry_id, type: string}
    - {name: row_key, type: string}
    - {name: row_label, type: string}
    - {name: column_key, type: string}
    - {name: column_label, type: string}
    - {name: quantity, type: number}
    - {name: entered_by, type: string}
    - {name: entered_at, type: datetime}
    server: full
    title: Inventory quantity history
  inventory_rows:
    client: none
    columns:
    - {name: row_key, type: string}
    - {name: label, type: string}
    - {name: sort_order, type: number}
    - {name: active, type: bool}
    server: full
    title: Inventory rows
  inventory_settings:
    client: none
    columns:
    - {name: settings_key, type: string}
    - {name: row_heading, type: string}
    server: full
    title: Inventory table settings
  users:
    client: none
    columns:
    - {name: email, type: string}
    - {name: enabled, type: bool}
    - {name: last_login, type: datetime}
    - {name: password_hash, type: string}
    - {name: n_password_failures, type: number}
    - {name: confirmed_email, type: bool}
    - {name: email_confirmation_key, type: string}
    - {name: remembered_logins, type: simpleObject}
    - {name: signed_up, type: datetime}
    - {name: initials, type: string}
    server: full
    title: Users
metadata: {logo_img: 'asset:tbl-letters-transparent.png', title: Inventory}
name: TBL Inventory
package_name: TBL_Inventory
runtime_options:
  client_version: '3'
  server_spec: {base: python314}
  version: 3
services:
- client_config: {enable_v2: true}
  server_config: {}
  source: /runtime/services/tables.yml
- client_config: {allow_remember_me: true, allow_signup: false, confirm_email: true, enable_automatically: true, remember_me_days: 30, require_secure_passwords: true, use_email: true}
  server_config:
    email_content:
      confirm_address:
        html: |-
          <p>Thanks for registering your account with us. Please click the following link to confirm that this is your account:</p>
          <p>{{confirm_link}}</p>
          <p>Thanks,</p>
          <p>The team</p>
      reset_password:
        html: |-
          <p>Hi there,</p>
          <p>You have requested a password reset for your account {{email}}. To reset your password, click the link below:</p>
          <p>{{reset_link}}</p>
          <p>This link will expire in ten minutes.</p>
    user_table: users
  source: /runtime/services/anvil/users.yml
startup: {module: Form1, type: form}
