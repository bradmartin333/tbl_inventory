<div anvil:dom-node="section" class="grid-section">
    <anvil-component type="Button" name="toggle_button" prop:role="section-toggle" prop:align="left" prop:spacing_above="none" prop:spacing_below="none"></anvil-component>
    <div anvil:dom-node="matrix_scroll" class="matrix-scroll">
        <div anvil:dom-node="matrix" class="inventory-matrix">
            <div class="matrix-header">
                <div class="matrix-row-heading">
                    <anvil-component type="Label" name="matrix_row_heading" prop:text="Item" prop:spacing_above="none" prop:spacing_below="none"></anvil-component>
                </div>
                <anvil-component type="RepeatingPanel" name="column_headers_panel" prop:item_template="TBL_Inventory.MainForm.ColumnHeading" prop:role="matrix-column-headers"></anvil-component>
            </div>
            <anvil-component type="RepeatingPanel" name="rows_panel" prop:item_template="TBL_Inventory.MainForm.GridRow"></anvil-component>
        </div>
    </div>
</div>
