<div anvil:dom-node="item" class="par-alert-item">
    <anvil-component type="Label" name="cell_label" prop:role="par-alert-cell" prop:spacing_above="none" prop:spacing_below="none" bind:text="self.item['label']"></anvil-component>
    <anvil-component type="Label" name="detail_label" prop:role="par-alert-detail" prop:spacing_above="none" prop:spacing_below="none" bind:text="self.item['detail']"></anvil-component>
</div>
